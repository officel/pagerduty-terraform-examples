---
# Original: https://pre-commit.com/
# Recommended: https://prek.j178.dev/

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-json
        exclude: |
          (?x)^(
            backup/[\d|\w|_]+\/(.*?)|
            docs/nodejs/ts_tutorial/tsconfig.json|
            path/to/file3.json
          )$
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: check-toml
      - id: check-xml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: 25eba0fb2eb4bd1d59dc69a59cb9976d821106e7  # frozen: v0.9.41
    hooks:
      - id: pymarkdown
        args:
          - --config=.config/.pymarkdown.yaml
          - scan
        exclude: |
          (?x)^(
            backup/[\d|\w|_]+\/(.*?)|
            habits/.*\.md|
            path/to/file3.py
          )$

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args:
          - -c=.config/.yamllint

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 443ffdff1cc1663b701ae73e7459029fe883455a  # frozen: v1.109.3
    hooks:
      - id: terraform_fmt
        exclude: |
          (?x)^(
            backup/[\d|\w|_]+\/(.*?)|
            .config/tfstyle/(.*?).tf
          )$
      - id: terraform_validate
        exclude: |
          (?x)^(
            backup/[\d|\w|_]+\/(.*?)|
            .config/tfstyle/(.*?).tf
          )$
      - id: terraform_trivy
        exclude: |
          (?x)^(
            backup/[\d|\w|_]+\/(.*?)|
            .config/tfstyle/(.*?).tf
          )$
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
        exclude: |
          (?x)^(
            backup/[\d|\w|_]+\/(.*?)|
            .config/tfstyle/(.*?).tf
          )$
      - id: terraform_docs
        args:
          - "--args=--lockfile=false"
          - "--args=--config=.terraform-docs.yml"
        exclude: |
          (?x)^(
            backup/[\d|\w|_]+\/(.*?)|
            .config/tfstyle/(.*?).tf
          )$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
